# tyty-adb.conf
MODE=auto
PORT=5555
USE_MDNS=yes
CONNECT_TIMEOUT=20
PING_TIMEOUT=10
HEALTH_CHECK_INTERVAL=45
MDNS_TIMEOUT=25

MIN_BACKOFF=5
MAX_BACKOFF=90
MAX_RETRIES=15

ENHANCED_SECURITY=yes
KILL_SERVER_ON_START=no
ADB_VENDOR_KEYS="${ADB_VENDOR_KEYS:-$HOME/.android}"
PAIRING_GRACE_SEC=35

LOG_LEVEL=info
MAX_LOG_SIZE=10
LOG_RETENTION_DAYS=7
